name: Bug report
description: Report a reproducible non-security problem with synthetic data.
body:
  - type: markdown
    attributes:
      value: Do not post vulnerabilities, credentials, private project data, or exploit details. Use SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: Commit and environment
      description: Include the Scavenger commit, Python version, and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Commands, expected behavior, actual behavior, and sanitized output.
    validations:
      required: true
